<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualization Engine - Live</title>
    <style>
        :root {
            /* TU Delft Official Colors */
            --tu-cyan: #00A6D6;
            --tu-black: #000000;
            --tu-white: #FFFFFF;
            --bg-color: #f4f4f9;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--tu-black);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: var(--tu-white);
            padding: 3rem 5rem;
            border-radius: 8px;
            border-top: 6px solid var(--tu-cyan);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--tu-cyan);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .status {
            font-weight: 500;
            color: #444;
            margin-bottom: 2rem;
        }

        /* A mathematical loader ring */
        .loader {
            margin: 0 auto 2rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--tu-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .terminal-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            text-align: left;
            margin-top: 1rem;
        }

        .accent { color: #569cd6; } /* VS Code Blue */
        .string { color: #ce9178; } /* VS Code Orange */
        .comment { color: #6a9955; font-style: italic; } /* VS Code Green */

    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Online</h1>
        <div class="status">Awaiting Plotly payload...</div>
        
        <div class="loader"></div>

        <div class="terminal-box">
            <span class="comment"># Systems and Control Environment Initialized</span><br>
            <span class="accent">Loading</span> module <span class="string">'SC42150'</span>... OK<br>
            <span class="accent">Verifying</span> Gilbert Strang matrix inverses... OK<br>
            <span class="accent">Checking</span> fridge for Delirium Tremens... <span class="string">1 Found</span><br>
            <span class="comment">Waiting for plot.py execution...</span>
        </div>
    </div>
</body>
</html>
